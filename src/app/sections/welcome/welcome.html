<section class="welcome">
  <div class="welcome__text" appReveal>
    <hr class="divider" />
    @for (line of w.welcome; track $index) {
      <p>{{ line }}</p>
    }
    <p class="welcome__sign">Con cariño, {{ w.partnerOne }} y {{ w.partnerTwo }}</p>
    <hr class="divider" />
  </div>

  <figure class="welcome__photo" appReveal>
    <img
      src="images/hero.jpg"
      alt="Los novios abrazados frente a un muro de piedra colonial"
      loading="lazy"
      width="1280"
      height="852"
    />
  </figure>
</section>
