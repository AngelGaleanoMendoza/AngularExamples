<section class="std">
  <div class="std__band" aria-hidden="true">
    <img src="images/atardecer.jpg" alt="" loading="lazy" />
  </div>

  <div class="std__body" appReveal>
    <span class="eyebrow">Reserva la fecha</span>
    <h2 class="std__names">
      <span>{{ w.partnerOne }}</span>
      <span class="std__amp"><i></i>&amp;<i></i></span>
      <span>{{ w.partnerTwo }}</span>
    </h2>
    <p class="std__date">{{ date }}</p>
    <a class="btn btn--gold" href="#rsvp">Confirma antes del {{ deadline }}</a>
    <hr class="divider" />
    <p class="std__text">
      Queremos que este día sea tan especial para ustedes como lo es para nosotros. Aquí
      encontrarán todo lo necesario para acompañarnos.
    </p>
    <hr class="divider" />
  </div>
</section>
